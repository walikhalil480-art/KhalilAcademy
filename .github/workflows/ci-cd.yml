name: Khalil Academy CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword2026
          POSTGRES_DB: khalil_academy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend Unit Tests & Build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword2026@localhost:5432/khalil_academy_db?schema=public"
          JWT_ACCESS_SECRET: "ci_jwt_access_secret_test"
          JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_test"
        run: |
          cd backend
          npm ci
          npx prisma db push --skip-generate
          npx prisma generate
          npm run build
          npm test

      - name: Frontend Build Verification
        run: |
          cd frontend
          npm ci
          npm run build

  security-scan:
    name: Container & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t khalil-academy-backend:latest ./backend

      - name: Trivy Vulnerability Scan (Backend Container)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'khalil-academy-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
